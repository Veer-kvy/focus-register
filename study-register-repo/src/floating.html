<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Register</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/floating.css">
</head>
<body class="floating-page">
  <button class="float-icon" id="floatIcon" type="button" title="Study Register" aria-label="Open the Study Register dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="8.25"></circle>
      <g class="float-hands">
        <line class="float-hand float-hand-hour" x1="12" y1="12" x2="12" y2="8.6"></line>
        <line class="float-hand float-hand-minute" x1="12" y1="12" x2="12" y2="6.7"></line>
        <circle class="float-hand-dot" cx="12" cy="12" r="0.9"></circle>
      </g>
    </svg>
  </button>
  <script src="js/floating.js"></script>
</body>
</html>
